<!doctype html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Numbers Lore Viewer</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="preload" as="fetch" href="assets/numbers-index.json" crossorigin>
	<script>
		// 索引やレンダラーの取得と同時に、開く記事の転送を始める。
		function documentPathFromHash() {
			try {
				const path = decodeURIComponent(location.hash.slice(1));
				if (path === "index.md" || /^numbers\/(?:\dxx\/\d{3}|1xxx\/\d{4})\.md$/.test(path)) return path;
			} catch { /* 不完全なパーセント符号を含むURLでは先頭の記事を開く。 */ }
			return "numbers/0xx/000.md";
		}
		const initialDocumentPath = documentPathFromHash();
		const preload = document.createElement("link");
		preload.rel = "preload";
		preload.as = "fetch";
		preload.crossOrigin = "anonymous";
		preload.href = initialDocumentPath;
		document.head.append(preload);
	</script>
	<link rel="stylesheet" href="assets/app.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>

<body>
	<div class="bg-shape bg-shape-a" aria-hidden="true"></div>
	<div class="bg-shape bg-shape-b" aria-hidden="true"></div>

	<header class="topbar">
		<h1>CheatSheet of Numbers</h1>
		<p>数字のいわれと性質を、種類別フィルタで探索できるGitHub Pagesビューアー</p>
	</header>

	<main class="layout">
		<aside class="sidebar" aria-label="数字一覧と検索条件">
			<div class="sidebar-head">
				<label for="jump">番号を直接指定<span id="jump-range"></span></label>
				<form id="jump-form" class="jump-row">
					<input id="jump" type="number" min="0" step="1" required inputmode="numeric" placeholder="例: 57">
					<button id="jump-go" type="submit">開く</button>
				</form>
				<label for="search">キーワード・Issue 番号で検索</label>
				<input id="search" type="search" placeholder="例: フィボナッチ、#8 SRAM">
			</div>

			<div class="filter-scroll" aria-label="フィルタ">
				<section class="filter-block" aria-label="いわれカテゴリ">
					<h2>いわれカテゴリ</h2>
					<div id="lore-filters" class="chip-list"></div>
				</section>

				<section class="filter-block" aria-label="性質カテゴリ">
					<h2>性質カテゴリ</h2>
					<div id="property-filters" class="chip-list"></div>
				</section>
			</div>

			<div class="sidebar-foot">
				<button id="clear-filters" type="button">フィルタをクリア</button>
				<p id="result-count" role="status">0件</p>
			</div>

			<nav class="doc-scroll" aria-label="数字の索引">
				<ul id="doc-list" class="doc-list"></ul>
				<button id="more-results" type="button" hidden>続きを表示</button>
			</nav>
		</aside>

		<section class="content" aria-live="polite">
			<article id="doc-view" class="doc-view">
				<p>左の一覧から数字を選択してください。</p>
			</article>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer></script>
	<script src="assets/app.js" defer></script>
</body>

</html>
